controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    system_traction_velocity_controller:
      type: caddy_ai2_ros2_control_system_traction_driver/SystemTractionVelocityController
    system_steering_controller:
      type: caddy_ai2_ros2_control_system_steering_driver/SystemSteeringController
    bicycle_steering_controller:
      type: caddy_ai2_ros2_control_system_bicycle_controller/BicycleSteeringController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# Configuración de controladores
system_traction_velocity_controller:
  ros__parameters:
    joints: [left_wheel_joint, right_wheel_joint]
    interface_name: velocity

system_steering_controller:
  ros__parameters:
    joints: [steering_joint]

bicycle_steering_controller:
  ros__parameters:
    front_steering_joints: ["front_left_steer_joint", "front_right_steer_joint"]
    rear_steering_joints: []  # si no hay dirección trasera
    wheel_joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    use_stamped: false
    wheelbase: 1.2
    track: 0.8

joint_state_broadcaster:
  ros__parameters: {}